name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@24c54180a607b1449ed407dd24f251e4e9147c8d # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify package signatures
        run: npm audit signatures

      - name: Check dependency advisory baseline
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Test and collect coverage
        run: npm run test:coverage

      - name: Build production application
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: warn
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5.0.0
        with:
          fail-on-severity: high
